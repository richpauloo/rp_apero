baseURL = "https://www.richpauloo.com/"
languageCode = "en"
title = "Rich Pauloo"
author = "Rich Pauloo"
copyright = "" # set to override the auto generated copyright using org info and now year
googleAnalytics = ""
disqusShortname = "" # see params.utterances to use utterances instead of Disqus
metaDataFormat = "yaml"
footnoteReturnLinkContents = "&#8617;" # ↩
# set deliberately low for testing choose your preffered number based on the blog layout you've chosen
[pagination]
  pagerSize = 5
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$", "index_files", "\\.svg$"]
enableEmoji = true

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true  # Enable user to embed HTML snippets in Markdown content.
    hardwraps = false 
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    # one of: https://xyproto.github.io/splash/docs/ 
    style = "base16-snazzy"
    
[params]
  orgName = "Rich Pauloo"
  orgLocal = ""
  description = "Thinker, tea drinker, tinkerer."
  favicon = "/img/favicon.svg"
  logo = "/img/favicon.svg"
  mainSections = ["project"]
  navallcaps = true
  # show/hide social icons in site header & footer
  # configure social icons and links below in [[params.social]]
  socialInHeader = false
  socialInFooter = true
  # Default image for social sharing and search engines. 
  # Place image file in `static` folder and specify image name here.
  sharing_image = "/img/avatar.jpeg"
  # Twitter username (without @). Used when a visitor shares your site on Twitter.
  twitter = "richpauloo"
  
  # Social icons may appear on homepage and in site header or footer
  # Configure show/hide above - add as many as you like below
  # Icon pack "fab" includes brand icons, see: https://fontawesome.com/icons?d=gallery&s=brands&m=free
  # Icon pack "fas" includes solid icons, see: https://fontawesome.com/icons?d=gallery&s=solid&m=free
  # Icon pack "far" includes regular icons, see: https://fontawesome.com/icons?d=gallery&s=regular&m=free
  [[params.social]]
      icon      = "github" # icon name without the 'fa-'
      icon_pack = "fab"
      url       = "https://github.com/richpauloo"
  #[[params.social]]
  #    icon      = "facebook-square" # icon name without the 'fa-'
  #    icon_pack = "fab"
  #    url       = "https://www.facebook.com/hashtag/ap%C3%A9ro"
  #[[params.social]]
  #    icon      = "instagram" # icon name without the 'fa-'
  #    icon_pack = "fab"
  #    url       = "https://www.instagram.com/explore/tags/apero/"
  [[params.social]]
      icon      = "twitter" # icon name without the 'fa-'
      icon_pack = "fab"
      url       = "https://twitter.com/richpauloo"
  #[[params.social]]
  #    icon      = "impactstory" # icon name without the 'fa-'
  #    icon_pack = "ai"
  #    url       = "https://impactstory.org/u/0000-0002-8082-1890"
  [[params.social]]
      icon      = "orcid" # icon name without the 'fa-'
      icon_pack = "ai"
      url       = "https://orcid.org/0000-0002-6231-9530"
  [[params.social]]
      icon      = "google-scholar" # icon name without the 'fa-'
      icon_pack = "ai"
      url       = "https://scholar.google.com/citations?user=39VtrnEAAAAJ"
  [[params.social]]
      icon      = "stack-overflow" # icon name without the 'fa-'
      icon_pack = "fab"
      url       = "https://stackoverflow.com/users/8367943/rich-pauloo"
  [[params.social]]
      icon      = "linkedin" # icon name without the 'fa-'
      icon_pack = "fab"
      url       = "https://www.linkedin.com/in/rpauloo/"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[menu]
  [[menu.header]]
    name = "Garden"
    title = "Garden"
    url = "/#garden"
    weight = 1
  [[menu.header]]
    name = "About"
    title = "About"
    url = "/about/"
    weight = 2

# see https://gohugo.io/about/hugo-and-gdpr/    
[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    disable = false
    anonymizeIP = true
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.twitter]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
