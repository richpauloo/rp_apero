<div class="ctrl-panel" id="ctrlPanel">
  <!-- Vector Controls -->
  <div id="flowControls">
    <h3>Vector Controls</h3>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Particles</div>
      <div class="ctrl-row"><label>Count</label><input type="range" id="fc-count" min="200" max="5000" step="100" value="3100"><span class="ctrl-val" id="fv-count">3100</span></div>
      <div class="ctrl-row"><label>Speed</label><input type="range" id="fc-speed" min="0.1" max="3" step="0.05" value="1.05"><span class="ctrl-val" id="fv-speed">1.05</span></div>
      <div class="ctrl-row"><label>Size</label><input type="range" id="fc-size" min="0.3" max="4" step="0.1" value="1.0"><span class="ctrl-val" id="fv-size">1.0</span></div>
      <div class="ctrl-row"><label>Opacity</label><input type="range" id="fc-opacity" min="0.1" max="1" step="0.05" value="0.8"><span class="ctrl-val" id="fv-opacity">0.80</span></div>
      <div class="ctrl-row"><label>Max age</label><input type="range" id="fc-maxlife" min="100" max="2000" step="50" value="2000"><span class="ctrl-val" id="fv-maxlife">2000</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Trails</div>
      <div class="ctrl-row"><label>Fade rate</label><input type="range" id="fc-trail" min="0.005" max="0.2" step="0.005" value="0.08"><span class="ctrl-val" id="fv-trail">0.080</span></div>
      <div class="ctrl-row"><button class="ctrl-btn" id="fc-clear">Clear canvas</button></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Flow geometry</div>
      <div class="ctrl-row"><label>Scale</label><input type="range" id="fc-noise" min="0.0003" max="0.008" step="0.0001" value="0.0038"><span class="ctrl-val" id="fv-noise">0.0038</span></div>
      <div class="ctrl-row"><label>Evolution</label><input type="range" id="fc-timespeed" min="0" max="0.005" step="0.0001" value="0.0004"><span class="ctrl-val" id="fv-timespeed">0.0004</span></div>
      <div class="ctrl-row"><label>Turbulence</label><input type="range" id="fc-turb" min="0.5" max="4" step="0.1" value="0.5"><span class="ctrl-val" id="fv-turb">0.5</span></div>
      <div class="ctrl-row"><label>Detail</label><input type="range" id="fc-detail" min="0" max="1" step="0.05" value="0.5"><span class="ctrl-val" id="fv-detail">0.50</span></div>
      <div class="ctrl-row"><label>Wind</label><input type="range" id="fc-wind" min="0" max="2" step="0.05" value="2.0"><span class="ctrl-val" id="fv-wind">2.00</span></div>
      <div class="ctrl-row"><label>Wind dir</label><input type="range" id="fc-winddir" min="0" max="360" step="15" value="0"><span class="ctrl-val" id="fv-winddir">0&deg;</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Mouse</div>
      <div class="ctrl-row"><label>Radius</label><input type="range" id="fc-mradius" min="20" max="400" step="10" value="120"><span class="ctrl-val" id="fv-mradius">120</span></div>
      <div class="ctrl-row"><label>Force</label><input type="range" id="fc-mforce" min="0" max="20" step="0.5" value="4"><span class="ctrl-val" id="fv-mforce">4.0</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Color</div>
      <div class="ctrl-row"><label>Palette</label><select id="fc-palette"><option value="weather" selected>Weather</option><option value="terrain">Terrain</option><option value="ocean">Ocean</option><option value="fire">Fire</option><option value="mono">Mono</option></select></div>
      <div class="ctrl-row"><label>Color by</label><select id="fc-colorby"><option value="position" selected>Position</option><option value="angle">Flow angle</option><option value="speed">Speed</option><option value="age">Age</option></select></div>
    </div>
  </div>
  <!-- Voronoi Controls -->
  <div id="voronoiControls" style="display: none;">
    <h3>Voronoi Controls</h3>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Points</div>
      <div class="ctrl-row"><label>Count</label><input type="range" id="vc-count" min="10" max="200" step="1" value="72"><span class="ctrl-val" id="vv-count">72</span></div>
      <div class="ctrl-row"><label>Speed</label><input type="range" id="vc-speed" min="0.05" max="2" step="0.05" value="0.6"><span class="ctrl-val" id="vv-speed">0.60</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Appearance</div>
      <div class="ctrl-row"><label>Fill opacity</label><input type="range" id="vc-fill" min="0" max="1" step="0.05" value="0.4"><span class="ctrl-val" id="vv-fill">0.40</span></div>
      <div class="ctrl-row"><label>Stroke opacity</label><input type="range" id="vc-stroke" min="0" max="1" step="0.05" value="0.9"><span class="ctrl-val" id="vv-stroke">0.90</span></div>
      <div class="ctrl-row"><label>Stroke width</label><input type="range" id="vc-strokew" min="0" max="4" step="0.1" value="1.2"><span class="ctrl-val" id="vv-strokew">1.2</span></div>
      <div class="ctrl-row"><label>Color speed</label><input type="range" id="vc-cspeed" min="0.1" max="5" step="0.1" value="1.4"><span class="ctrl-val" id="vv-cspeed">1.4x</span></div>
      <div class="ctrl-row"><label>Cell inset</label><input type="range" id="vc-inset" min="0" max="15" step="0.5" value="4"><span class="ctrl-val" id="vv-inset">4.0</span></div>
      <div class="ctrl-row"><label>Shadow</label><input type="range" id="vc-shadow" min="0" max="20" step="1" value="0"><span class="ctrl-val" id="vv-shadow">0</span></div>
      <div class="ctrl-row"><label>Opacity var</label><input type="range" id="vc-opvar" min="0" max="0.8" step="0.05" value="0"><span class="ctrl-val" id="vv-opvar">0.00</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-group-label">Palette</div>
      <div class="ctrl-row"><label>Colors</label><select id="vc-palette"><option value="terrain" selected>Terrain</option><option value="weather">Weather</option><option value="ocean">Ocean</option><option value="sunset">Sunset</option><option value="forest">Forest</option></select></div>
    </div>
  </div>
</div>
