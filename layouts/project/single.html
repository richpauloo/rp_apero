{{ define "main" }}
<div class="page-content">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.links }}
  <div class="project-links">
    {{ range . }}
      <a href="{{ .url }}" class="project-link" target="_blank" rel="noopener">{{ .name }}</a>
    {{ end }}
  </div>
  {{ end }}
  <div class="prose">
    {{ .Content }}
  </div>
</div>
{{ end }}
